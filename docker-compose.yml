version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: graphrag_postgres
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag123
      POSTGRES_DB: graphrag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.15
    container_name: graphrag_neo4j
    environment:
      NEO4J_AUTH: neo4j/graphrag123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt protocol
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data: